name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/doctor.py --strict
      - run: python -m compileall -q fluxfile_core.py fluxfile_batch.py fluxfile.py fluxfile_cli.py extended_formats.py
      - run: python fluxfile_cli.py --engines
      - run: python -m unittest discover -s tests -v

  extended-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2
      - run: python -m pip install -r requirements.txt -r requirements-optional.txt
      - run: python -m compileall -q fluxfile_core.py fluxfile_batch.py fluxfile.py fluxfile_cli.py extended_formats.py
      - run: python fluxfile_cli.py --engines
      - run: python -m unittest discover -s tests -v
